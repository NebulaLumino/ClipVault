<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24" />
      <stop offset="100%" style="stop-color:#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="12" fill="url(#bgGradient)" stroke="url(#iconGradient)" stroke-width="0.5"/>

  <!-- Vault/Safe icon base -->
  <rect x="8" y="12" width="24" height="18" rx="2" fill="none" stroke="url(#iconGradient)" stroke-width="1.5"/>

  <!-- Vault door -->
  <circle cx="20" cy="21" r="4" fill="none" stroke="url(#iconGradient)" stroke-width="1.5"/>
  <circle cx="20" cy="21" r="1.5" fill="url(#iconGradient)"/>

  <!-- Play button overlay (representing clips) -->
  <g transform="translate(26, 8)">
    <circle cx="4" cy="4" r="4" fill="url(#iconGradient)" opacity="0.9"/>
    <polygon points="2.5,2 2.5,6 5.5,4" fill="white"/>
  </g>

  <!-- Gaming controller elements -->
  <circle cx="12" cy="18" r="1" fill="url(#iconGradient)" opacity="0.6"/>
  <circle cx="28" cy="24" r="1" fill="url(#iconGradient)" opacity="0.6"/>
</svg>